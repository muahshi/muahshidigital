<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mubashir Hasan | AI Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syncopate:wght@700&display=swap');
        :root { --gold: #FFD700; --dark-gold: #B8860B; }
        body { background: #030303; color: #f3f4f6; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }
        .syncopate { font-family: 'Syncopate', sans-serif; }
        .gold-gradient { background: linear-gradient(90deg, var(--gold), #FDB931, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-nav { background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .profile-img { border-radius: 20px; border: 1px solid rgba(255, 215, 0, 0.2); width: 100%; height: auto; object-fit: cover; }
        .typewriter::after { content: "|"; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <nav class="glass-nav fixed top-0 w-full">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-black syncopate gold-gradient">MUAHSHI.</div>
            <a href="mailto:muahshi7759@axl" class="text-[10px] font-bold border border-yellow-500/20 px-4 py-2 rounded-full hover:bg-yellow-500 hover:text-black transition">CONTACT</a>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-32 pb-20 lg:pt-48 lg:pb-32 flex flex-col lg:grid lg:grid-cols-2 gap-12 lg:gap-20 items-center">
        <div class="w-full max-w-md lg:max-w-none order-1 lg:order-1">
            <img src="mubu_logo.webp" alt="Mubashir Hasan" class="profile-img shadow-2xl shadow-yellow-500/10">
        </div>
        
        <div class="order-2 lg:order-2 text-center lg:text-left">
            <div class="flex items-center justify-center lg:justify-start gap-3 mb-6">
                <span class="w-8 h-[1px] bg-yellow-500/50"></span>
                <h2 class="text-yellow-500 text-[10px] font-bold uppercase tracking-[0.3em]">AI Architect & Amazon FBA</h2>
            </div>
            <h1 class="text-5xl md:text-7xl lg:text-[100px] font-black leading-tight lg:leading-[0.8] mb-8 syncopate tracking-tighter uppercase">
                Smarter <br> <span class="gold-gradient typewriter" id="typewriter">Systems.</span>
            </h1>
            <p class="text-gray-400 text-lg md:text-xl mb-10 leading-relaxed max-w-lg mx-auto lg:mx-0">
                Architecting high-performance automation for modern founders.
            </p>
            <div class="flex flex-col sm:flex-row justify-center lg:justify-start gap-6">
                <a href="#work" class="bg-gradient-to-r from-yellow-500 to-yellow-700 text-black px-10 py-5 rounded-2xl font-bold uppercase tracking-widest text-sm hover:scale-105 transition-all">My Work</a>
                <div class="flex flex-col justify-center">
                    <span class="text-white font-bold text-xl">150+</span>
                    <span class="text-gray-600 text-[10px] uppercase tracking-widest">Automations Live</span>
                </div>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-6 mb-24">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 bg-white/[0.02] border border-white/5 p-8 rounded-[40px] text-center">
            <div>
                <div class="text-3xl font-bold mb-1">04<span class="text-yellow-500">+</span></div>
                <div class="text-[9px] uppercase tracking-widest text-gray-500">Years Exp</div>
            </div>
            <div>
                <div class="text-3xl font-bold mb-1">USA</div>
                <div class="text-[9px] uppercase tracking-widest text-gray-500">Logistics</div>
            </div>
            <div>
                <div class="text-3xl font-bold mb-1">n8n</div>
                <div class="text-[9px] uppercase tracking-widest text-gray-500">Automation</div>
            </div>
            <div>
                <div class="text-3xl font-bold mb-1">MBA</div>
                <div class="text-[9px] uppercase tracking-widest text-gray-500">Strategy</div>
            </div>
        </div>
    </section>

    <script>
        const text = document.getElementById('typewriter');
        const phrases = ['Systems.', 'AI Agents.', 'Efficiency.'];
        let i = 0, j = 0, isDeleting = false;
        function type() {
            let current = phrases[i];
            if (isDeleting) {
                text.textContent = current.substring(0, j--);
                if (j < 0) { isDeleting = false; i = (i + 1) % phrases.length; j = 0; }
            } else {
                text.textContent = current.substring(0, j++);
                if (j > current.length) { isDeleting = true; setTimeout(type, 2000); return; }
            }
            setTimeout(type, isDeleting ? 100 : 150);
        }
        type();
    </script>
</body>
</html>
